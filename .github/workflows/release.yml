name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'StvyaSharma/turborepo-remote-cache-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Validate version and publish migration notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun apps/server/scripts/release.ts
