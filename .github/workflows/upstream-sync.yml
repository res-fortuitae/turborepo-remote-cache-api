name: Upstream sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.UPSTREAM_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require a token that can trigger PR CI
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: test -n "$SYNC_TOKEN"
      # A dedicated token is required so PR creation triggers normal PR CI.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Merge release tags and open pull requests
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY }}
        run: bun apps/server/scripts/upstream-sync.ts
