name: OIDC runner lifecycle
on:
  workflow_call:
    inputs:
      self_hosted_labels:
        default: "[]"
        type: string
  workflow_dispatch:
    inputs:
      self_hosted_labels:
        description: Optional JSON runner labels, e.g. ["self-hosted","linux","arc"]
        default: "[]"
        type: string
permissions:
  contents: read
jobs:
  hosted:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        wrapper: [direct, composite]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun scripts/oidc-runner-probe.ts start
      - uses: ./.github/actions/verify-proxy-cleanup
      - if: matrix.wrapper == 'direct'
        uses: ./packages/action
        with:
          api: ${{ env.TCACHE_PROBE_API }}
          team: org
          project: p
          strict: "true"
      - if: matrix.wrapper == 'composite'
        uses: ./.github/actions/proxy-probe-wrapper
        with:
          api: ${{ env.TCACHE_PROBE_API }}
      - run: bun scripts/oidc-runner-probe.ts check
  container:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun scripts/oidc-runner-probe.ts start
      - uses: ./.github/actions/verify-proxy-cleanup
      - uses: ./.github/actions/proxy-probe-wrapper
        with:
          api: ${{ env.TCACHE_PROBE_API }}
      - run: bun scripts/oidc-runner-probe.ts check
  self-hosted:
    if: github.event_name == 'workflow_dispatch' && inputs.self_hosted_labels != '[]'
    runs-on: ${{ fromJSON(inputs.self_hosted_labels || '[]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun scripts/oidc-runner-probe.ts start
      - uses: ./.github/actions/verify-proxy-cleanup
      - uses: ./.github/actions/proxy-probe-wrapper
        with:
          api: ${{ env.TCACHE_PROBE_API }}
      - run: bun scripts/oidc-runner-probe.ts check
