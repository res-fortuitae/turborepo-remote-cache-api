name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    permissions:
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Configure repository remote cache
        uses: ./.github/actions/remote-cache
        with:
          api: ${{ vars.TCACHE_API }}
          team: ${{ vars.TCACHE_TEAM }}
          project: ${{ vars.TCACHE_PROJECT }}
      - run: bun run build
      - run: bun run check
      - name: Test within the runner CPU budget
        run: bun run test --concurrency=2
      - name: JWT hot-path performance smoke
        run: bun run perf:smoke
  oidc-runner-lifecycle:
    uses: ./.github/workflows/oidc-runner-lifecycle.yml
