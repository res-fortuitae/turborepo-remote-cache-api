name: Fork ownership

on:
  pull_request:

permissions:
  contents: read

jobs:
  warn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn about organization changes to upstream-owned code
        uses: actions/github-script@v7
        env:
          UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY }}
        with:
          script: |
            const { data: repo } = await github.rest.repos.get(context.repo);
            const upstream = process.env.UPSTREAM_REPOSITORY || repo.parent?.full_name;
            if (!upstream || upstream === `${context.repo.owner}/${context.repo.repo}`) return;
            if (!/^[\w.-]+\/[\w.-]+$/.test(upstream)) throw new Error('Invalid upstream repository');
            let parent;
            try {
              ({ data: parent } = await github.rest.repos.get({ owner: upstream.split('/')[0], repo: upstream.split('/')[1] }));
            } catch {
              core.warning('Could not read upstream repository metadata. Check upstream repository access before upgrading.');
              return;
            }
            const fetch = await exec.exec('git', ['fetch', `https://github.com/${upstream}.git`, parent.default_branch], { ignoreReturnCode: true });
            if (fetch !== 0) {
              core.warning('Could not read upstream history. Check upstream repository access before upgrading.');
              return;
            }
            let changed = '';
            const diff = await exec.exec('git', ['diff', '--name-only', 'FETCH_HEAD...HEAD', '--', 'apps/', 'packages/', 'alchemy.run.ts', '.github/', 'deploy.config.example.ts', 'package.json', 'bun.lock', 'turbo.json', 'oxlint.config.mts', 'oxfmt.config.mts'], {
              ignoreReturnCode: true,
              listeners: { stdout: data => changed += data.toString() }
            });
            if (diff !== 0) core.warning('Could not compare fork history with upstream. Review ownership changes manually.');
            if (changed.trim()) core.warning(`Organization edits to upstream-owned files can conflict with upgrades. Use deploy.config.ts and custom/ instead.\n${changed}`);
