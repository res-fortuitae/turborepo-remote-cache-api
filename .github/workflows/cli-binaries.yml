name: CLI binaries (no publication)
on:
  pull_request:
    paths:
      - "packages/cli/**"
      - "packages/client-core/**"
      - "packages/api-spec/**"
      - "packages/shared/**"
      - "bun.lock"
      - ".github/workflows/cli-binaries.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            linux-x64,
            linux-arm64,
            linux-x64-musl,
            linux-arm64-musl,
            darwin-x64,
            darwin-arm64,
            windows-x64,
          ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/cli build ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-${{ matrix.target }}
          path: |
            packages/cli/dist/tcache-*
            packages/cli/dist/THIRD_PARTY_LICENSES.txt
            packages/cli/dist/LICENSE.bun
          if-no-files-found: error
  native-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest, file: tcache-linux-x64 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, file: tcache-linux-arm64 }
          - { target: darwin-arm64, runner: macos-15, file: tcache-darwin-arm64 }
          - { target: darwin-x64, runner: macos-15-intel, file: tcache-darwin-x64 }
          - { target: windows-x64, runner: windows-latest, file: tcache-windows-x64.exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: binary-${{ matrix.target }}
          path: packages/cli/dist
      - shell: bash
        run: |
          chmod +x packages/cli/dist/${{ matrix.file }}
          packages/cli/dist/${{ matrix.file }} --version
          packages/cli/dist/${{ matrix.file }} --help
          bun run --cwd packages/cli bench:startup
  assemble:
    needs: [build, native-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: binary-*
          path: packages/cli/dist
          merge-multiple: true
      - run: |
          bun packages/cli/scripts/manifest.ts
          bun packages/cli/scripts/homebrew.ts
          cp packages/cli/distribution/install.sh packages/cli/dist/install.sh
      - name: Smoke test musl on Alpine
        run: |
          chmod +x packages/cli/dist/tcache-linux-x64-musl
          docker run --rm -v "$PWD/packages/cli/dist:/artifacts:ro" alpine:3.22 sh -c 'apk add --no-cache libstdc++ && /artifacts/tcache-linux-x64-musl --version'
      - name: Smoke test distroless container
        run: |
          docker build --build-arg TCACHE_ARCH=x64 -f packages/cli/distribution/Dockerfile -t tcache-test packages/cli
          docker run --rm tcache-test --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-local-test-bundle
          path: packages/cli/dist
          if-no-files-found: error
  sign:
    # Opt-in signing only. This workflow never publishes npm packages, releases, or images.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/cli-v') && vars.TCACHE_RELEASE_SIGNING_ENABLED == 'true'
    needs: assemble
    environment: cli-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-local-test-bundle
          path: artifacts
      - name: Require candidate version tag
        run: test "$GITHUB_REF_NAME" = "cli-v0.1.0"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: artifacts/tcache-*
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - run: cosign sign-blob --yes --bundle artifacts/SHA256SUMS.sigstore.json artifacts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-signed-candidate
          path: artifacts
